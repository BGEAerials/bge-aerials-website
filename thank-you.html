<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Sent | B.G.E. Aerials</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center;padding:24px}.card{max-width:680px}.logo{width:min(440px,85vw);height:auto;margin-bottom:28px}h1{font-size:clamp(34px,6vw,72px);margin:0 0 18px;text-transform:uppercase}p{font-size:clamp(16px,2vw,22px);line-height:1.5;color:#d8d8d8}a{display:inline-block;margin-top:22px;padding:14px 28px;background:#fff;color:#000;text-decoration:none;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  
    /* Tablet-only thank-you logo fix: render the clean logo as a background layer
       to avoid the stray horizontal artifact seen in iPad Safari. */
    .tablet-clean-logo{display:none}
    @media (min-width:761px) and (max-width:1366px) and (hover:none),
           (min-width:761px) and (max-width:1366px) and (pointer:coarse){
      .logo{display:none!important}
      .tablet-clean-logo{
        display:block;
        width:min(440px,60vw);
        aspect-ratio:590/202;
        margin:0 auto 28px;
        background:url("assets/contact-logo-clean.png") center/contain no-repeat;
        border:0!important;
        outline:0!important;
        box-shadow:none!important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/contact-logo-clean.png" alt="B.G.E. Aerials"><div class="tablet-clean-logo" role="img" aria-label="B.G.E. Aerials"></div>
    <h1>✓ Message Sent Successfully!</h1>
    <p>Thanks for contacting B.G.E. Aerials. Cory will personally review your inquiry and respond within 24 hours.</p>
    <p>I appreciate the opportunity to work with you and look forward to discussing your project.</p>
    <a href="index.html">Return Home</a>
  </main>
</body>
</html>

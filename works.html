        margin:0;
        overflow:hidden;
        background:#020202;
      }

        display:none!important;
      }

      .works-approved-desktop{

        width:100vw;
        height:calc(100vh - 70px);
        overflow:hidden;
        background:#020202;
      }

      .works-approved-desktop img{
        display:block;
        width:100%;
        height:100%;
        object-fit:cover;
        object-position:center top;
        border:0;
      }

      body.works-page>.mobile-header,
      body.works-page>.mobile-drawer,

      }
